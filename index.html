  <script type="text/ng-template" id="projects.html">
    <section>
      <h2>Selected Projects</h2>
      <div class="grid projects-grid">
        <article class="card" ng-repeat="p in main.projects">
          <a href="#!/projects/{{p.id}}">
            <img ng-src="{{p.image || 'assets/images/project-placeholder.png'}}" alt="{{p.title}} screenshot" />
          </a>
          <div class="card-body">
            <h3><a href="#!/projects/{{p.id}}">{{p.title}}</a></h3>
            <p class="muted">{{p.short}}</p>
            <p class="tags"><span ng-repeat="t in p.tags" class="tag">{{t}}</span></p>
            <div class="card-actions">
              <a ng-href="{{p.live}}" target="_blank" ng-if="p.live" class="btn small">Live</a>
              <a ng-href="{{p.repo}}" target="_blank" ng-if="p.repo" class="btn small btn-outline">Repo</a>
            </div>
          </div>
        </article>

    </section>

  <script type="text/ng-template" id="about.html">
    <section>
      <h2>About Me</h2>
      <p>I am a passionate Full Stack Developer focused on building scalable web applications and developer tools that enhance both performance and usability. I thrive on improving the developer experience through efficient workflows, automation, and clean, maintainable code. My approach blends creativity with precision — designing user interfaces that feel fast, intuitive, and predictable, while ensuring robust backend systems that scale effortlessly. I also enjoy turning complex problems into seamless, impactful digital experiences.</p>
      <h3>Education & Certifications</h3>
      <ul>
        <li>BSc. Computer Science - <a href="https://www.uonbi.ac.ke" target="_blank">University of Nairobi</a></li>
        <li><a href="#!/about">Full Stack Developer - freeCodeCamp</a></li>
      </ul>

      <h3>How I work</h3>
      <p>My development process is built around a <strong>test-driven approach</strong>, where each feature is validated through clear, automated tests to ensure stability and long-term maintainability. By writing tests first, I can confidently refactor code and deliver robust, high-quality solutions. This discipline helps prevent regressions, encourages clean architecture, and keeps projects adaptable to new features or technologies without sacrificing reliability.<br><br>

        <strong>I believe in small, iterative releases</strong> that promote <em>agility and continuous improvement</em>. Delivering in smaller cycles allows for quick feedback loops and better alignment with product goals. Collaboration is key — <strong>I work closely with designers and product owners</strong> to translate ideas into <em>practical, user-focused experiences</em>, ensuring that every release reflects both technical excellence and a strong understanding of user needs.        
      </p>
    </section>

    <section class="puzzle-section">
      
        <h3>My interests</h3>
        <p>Apart from web development, I also enjoy playing and creating games. This allows me to practice general algorithm and data structure design, code optimization, and AI function and agent design. The following puzzle is made using JavaScript controlling a canvas element. JavaScript controls keyboard/mouse interactions as well as the animation.</p>

      <div class="puzzle-canvas">
        <canvas id="puzzleCanvas" height="480" puzzle-canvas></canvas>        
      </div>
    </section>
    
  </script>

  <script type="text/ng-template" id="contact.html">
    <section>
      <h2>Contact</h2>
      <p>Interested in working together? <strong>Email me</strong> at <a href="mailto:katikumut@gmail.com">katikumut@gmail.com</a> or <a href="tel:+254708793131">call +254 708 793 131</a> or use this quick form:</p>
      <form class="contact-form" name="contactForm" ng-submit="main.sendContact(contactForm)" novalidate>
        <label>
          Name
          <input type="text" name="name" ng-model="main.contact.name" placeholder="John Doe" required />
        </label>
        <label>
          Email
          <input type="email" name="email" ng-model="main.contact.email" placeholder="john@doe.com" required />
        </label>
        <label>
          Message
          <textarea name="message" ng-model="main.contact.message" placeholder="Type your message here" required></textarea>
        </label>
        <button class="btn" type="submit" ng-disabled="contactForm.$invalid">Send</button>
        <span class="muted" ng-if="main.contactSent">Thanks — message sent!</span>
      </form>
    </section>
  </script>

  <script type="text/ng-template" id="project-detail.html">
    <section class="project-detail" ng-if="proj">
      <a href="#!/projects" class="back-link">← Back to Projects</a>
      <h2>{{ proj.title }}</h2>
      <img ng-src="{{ proj.image || 'assets/images/project-placeholder.png' }}" alt="{{ proj.title }}" class="detail-image" />
  
      <p class="muted">{{ proj.short }}</p>
  
      <h3>Overview</h3>
      <p>{{ proj.description }}</p>
  
      <h3>Technologies</h3>
      <p class="tags">
        <span class="tag" ng-repeat="t in proj.tags">{{ t }}</span>
      </p>
  
      <h3>Links</h3>
      <p>
        <a ng-href="{{ proj.live }}" target="_blank" ng-if="proj.live" class="btn small">Live Demo</a>
        <a ng-href="{{ proj.repo }}" target="_blank" ng-if="proj.repo" class="btn small btn-outline">View Code</a>
      </p>
    </section>
  
    <section ng-if="!proj">
      <p>Project not found. <a href="#!/projects">Return to projects</a>.</p>
    </section>
  </script>
  <!-- Menu Mobile/Small Devices -->
  <script>
    (function(){
      const menuBtn = document.getElementById('menuToggle');
      const navLinks = document.getElementById('navLinks');
  
      if(menuBtn && navLinks){
        menuBtn.addEventListener('click', () => {
          const isOpen = navLinks.classList.toggle('show');
          navLinks.querySelectorAll('a').forEach(link => {
            link.style.color = isOpen ? '#00bcd4' : '#000';
          });
        });
  
        // Optional: close menu when clicking a link
        navLinks.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            navLinks.classList.remove('show');
            // navLinks.querySelectorAll('a').forEach(l => l.style.color = '#fff');
          });
        });
      }
    })();
  </script>

  <script>
    (function(){
      const progressBar = document.getElementById('scrollProgress');

      window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
        const scrolled = (scrollTop / scrollHeight) * 100;
        progressBar.style.width = scrolled + '%';
      });
    })();
  </script>

  <button id="backToTop" class="back-to-top" ng-click="main.scrollToTop()">
